---
name: elisa
confinement: strict
grade: stable
base: core24
adopt-info: elisa
icon: $CRAFT_PROJECT_DIR/logo.png
apps:
  elisa:
    extensions:
      - kde-neon-6
    common-id: org.kde.elisa.desktop
    desktop: usr/share/applications/org.kde.elisa.desktop
    command: usr/bin/elisa
    slots:
      - mpris
    plugs:
      - home
      - removable-media
      - screen-inhibit-control
      - audio-playback

environment:
  LD_LIBRARY_PATH: >
    "$SNAP/kf6/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$SNAP/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/elisa${LD_LIBRARY_PATH}:$SNAP/ffmpeg-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
  PATH: $SNAP/ffmpeg-platform/usr/bin:${PATH}
  ALSA_CONFIG_PATH: "$SNAP/kf6/etc/asound.conf"

plugs:
  ffmpeg-2404:
    interface: content
    target: ffmpeg-platform
    default-provider: ffmpeg-2404

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    symlink: $SNAP/usr/share/alsa
  "/etc/alsa/conf.d":
    bind: "$SNAP/etc/alsa/conf.d"

slots:
  session-dbus-interface:
    interface: dbus
    name: org.kde.elisa
    bus: session
  mpris-elisa:
    interface: dbus
    name: org.mpris.MediaPlayer2.elisa
    bus: session

parts:
  sdl3:
    plugin: cmake
    source: https://github.com/libsdl-org/SDL.git
    source-tag: release-3.4.12
    build-packages:
      - libasound2-dev
      - libpulse-dev
      - libpipewire-0.3-dev
      - pkg-config
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_SHARED=ON
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
      - -DSDL_VIDEO=OFF
      - -DSDL_CAMERA=OFF
      - -DSDL_JOYSTICK=OFF
      - -DSDL_HAPTIC=OFF
      - -DSDL_UNIX_CONSOLE_BUILD=ON
    prime:
      - usr/lib/*/libSDL3*.so*
      - usr/lib/libSDL3*.so*

  dragon-media-backend:
    after: [sdl3]
    plugin: cmake
    source: https://invent.kde.org/libraries/dragon-media-backend.git
    source-tag: v0.82.1
    build-snaps:
      - kde-qt6-core24-sdk/latest/beta
      - kf6-core24-sdk/latest/beta
    build-packages:
      - libavcodec-dev
      - libavformat-dev
      - libswresample-dev
      - libavutil-dev
      - libasound2-dev
      - libpulse-dev
      - libpipewire-0.3-dev
      - libkissfft-dev
      - qcoro-qt6-dev
      - pkg-config
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTING=OFF
    prime:
      - -usr/lib/*/cmake/*
      - -usr/include/*

  elisa:
    after: [dragon-media-backend]
    parse-info:
      - usr/share/metainfo/org.kde.elisa.appdata.xml
    plugin: cmake
    source: .
    source-type: local
    build-snaps:
      - kde-qt6-core24-sdk/latest/beta
      - kf6-core24-sdk/latest/beta
    build-packages:
      - pkg-config
    stage-packages:
      - libasound2
      - libasound2-plugins
      - libasound2-data
      - libpulse0
      - libpipewire-0.3-0
      - libkissfft-float131
      - libqcoro6core0t64
      - libqcoro6network0t64
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
    prime:
      - -usr/lib/*/cmake/*
      - -usr/include/*
      - -usr/share/ECM/*
      - -usr/share/man/*
      - -usr/bin/X11
      - -usr/lib/gcc/$CRAFT_ARCH_TRIPLET_BUILD_FOR/6.0.0
      - -usr/lib/aspell/*
      - -usr/share/lintian

  gpu-2404:
    after: [elisa]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
    prime:
      - bin/gpu-2404-wrapper

  cleanup:
    after:
      - elisa
    plugin: nil
    build-snaps:
      - core24
      - kf6-core24
      - ffmpeg-2404
    override-prime: |
        set -eux
        for snap in "core24" "kf6-core24" "ffmpeg-2404"; do
            cd "/snap/$snap/current" && find . -type f,l -exec rm -rf "${CRAFT_PRIME}/{}" \;
        done
